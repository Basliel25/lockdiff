[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lockdiff"
version = "0.1.0"
description = "Human-readable diff for uv.lock and package-lock.json"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Basliel B. Gugsa" }]
keywords = ["lockfile", "uv", "npm", "diff", "dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.scripts]
lockdiff = "lockdiff.__main__:main"

[project.urls]
Homepage = "https://github.com/Basliel25/lockdiff"
Notes = "https://basz-website.basgug25.workers.dev/vault/Lockdiff/"

[tool.hatch.build.targets.wheel]
packages = ["src/lockdiff"]
